[tool.poetry]
name = "skilled-agent"
version = "0.1.0"
description = "A modular, scalable, and open-source-ready AI agent stack."
authors = ["Expert Developer <dev@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = "^0.27.1"
litellm = "^1.27.0"
pydantic = "^2.6.1"
pydantic-settings = "^2.1.0"
sqlmodel = "^0.0.16"
alembic = "^1.13.1"
python-multipart = "^0.0.9"
qdrant-client = "^1.7.3"
python-dotenv = "^1.0.1"
httpx = "^0.27.0"
pypdf = "^4.1.0"
langchain-text-splitters = "^0.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.2.2"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
